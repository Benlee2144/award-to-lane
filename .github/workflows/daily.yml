name: Daily call sheet

on:
  schedule:
    - cron: "30 11 * * 1-5"      # every weekday at 11:30 UTC (06:30 Central daylight time)
  workflow_dispatch:              # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - data/lead_status.csv      # a rep pushed statuses (run_daily.py status ... --push): republish the sheet with them

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-call-sheet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database, downloaded PDFs and recent output folders live in the Actions cache between runs,
      # never in git. The newest cache is restored; a fresh key is saved after every run.
      - name: Restore state (database, PDF cache, recent output)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/award_to_lane.sqlite
            data/pdfs
            output
          key: award-to-lane-state-${{ github.run_id }}
          restore-keys: award-to-lane-state-

      - name: Run Award-to-Lane
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          USDA_MARS_API_KEY: ${{ secrets.USDA_MARS_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python run_daily.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/award_to_lane.sqlite
            data/pdfs
            output
          key: award-to-lane-state-${{ github.run_id }}

      - name: Keep a copy of the database (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-${{ github.run_id }}
          path: data/award_to_lane.sqlite
          retention-days: 30
          if-no-files-found: ignore

      - name: Build site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python scripts/build_site.py --output output --site site --keep-days 30

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
